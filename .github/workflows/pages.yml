name: Deploy site
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Update vulnerability data']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: |
          mkdir _site
          cp -r index.html news.html app.js news.js version.js styles.css data feeds _site/
          # Version the script and style URLs so browsers never pair a new page with a cached old script.
          V=${GITHUB_SHA::8}
          find _site -name '*.html' -exec sed -i -E "s#(app\.js|news\.js|version\.js|styles\.css)\"#\1?v=$V\"#g" {} +
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
