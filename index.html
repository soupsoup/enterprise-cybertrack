<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enterprise CyberTrack</title>
<meta name="description" content="Vulnerabilities that threaten enterprise infrastructure: edge devices, identity, email, backup and DevOps platforms.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V9z' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3C/svg%3E">
<meta property="og:title" content="Enterprise CyberTrack">
<meta property="og:description" content="Track exploited and high-severity vulnerabilities in enterprise infrastructure, ranked by exploitation risk.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Enterprise <span>CyberTrack</span></h1>
    <p class="tag">Vulnerabilities in the systems enterprises run, ranked by how likely they are to be exploited.</p>
  </div>
</header>
<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <section class="stats" id="stats" aria-label="Summary"></section>
  <section class="controls" aria-label="Filters">
    <input id="q" type="search" placeholder="Search CVE, vendor, product, description" aria-label="Search">
    <select id="category" aria-label="Category"><option value="">All categories</option></select>
    <select id="vendor" aria-label="Vendor"><option value="">All vendors</option></select>
    <select id="severity" aria-label="Severity">
      <option value="">Any severity</option><option value="critical">Critical (9.0+)</option>
      <option value="high">High (7.0-8.9)</option><option value="medium">Medium and below</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="risk">Sort: risk score</option><option value="date">Sort: newest</option>
      <option value="cvss">Sort: CVSS</option><option value="epss">Sort: EPSS</option>
    </select>
    <label class="chk"><input id="kev" type="checkbox"> Known exploited only</label>
    <label class="chk"><input id="win" type="checkbox"> Include Windows &amp; Endpoint</label>
  </section>
  <p id="count" class="count" aria-live="polite"></p>
  <ul id="list" class="list"></ul>
  <p class="count"><a href="data/cves.json">Download data (JSON)</a></p>
</main>
<dialog id="detail"></dialog>
<footer class="wrap foot">
  <span id="updated"></span>Sources: NVD, CISA Known Exploited Vulnerabilities, FIRST EPSS. Risk score is a local heuristic, not an official rating.
</footer>
<script src="app.js"></script>
</body>
</html>
